<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus Financial | Nominee Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}</style>
<link href="../shared/app-shell.css" rel="stylesheet"/>
<link href="../shared/ui-polish.css" rel="stylesheet"/></head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

<main class="ml-64 min-h-screen">
<header class="h-16 border-b border-slate-800 flex items-center justify-between px-8"><div class="text-slate-400 text-sm">Nominee Management</div><div class="text-sm text-slate-300" id="userBadge"></div></header>
<section class="p-8 space-y-6">
<div class="flex items-center justify-between">
<div><h2 class="text-3xl font-bold" id="pageTitle">My Nominees</h2><p class="text-slate-400 mt-1" id="pageSubtitle">Manage nominee information linked to the customer record.</p></div>
<button class="bg-cyan-400 text-slate-950 px-5 py-3 rounded-lg font-semibold flex items-center gap-2" id="newNomineeBtn"><span class="material-symbols-outlined">add</span> Add Nominee</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="text-slate-400 text-sm">Nominees</div><div class="text-2xl font-bold mt-2" id="nomineeCount">—</div></div>
<div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="text-slate-400 text-sm">Total Share</div><div class="text-2xl font-bold mt-2" id="shareTotal">—</div></div>
<div class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="text-slate-400 text-sm">Access</div><div class="text-2xl font-bold mt-2" id="accessType">Customer</div></div>
</div>
<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
<div class="p-5 border-b border-slate-800 flex items-center justify-between"><h3 class="text-xl font-semibold" id="tableTitle">My Nominees</h3><button class="px-3 py-2 border border-slate-700 rounded-lg hover:bg-slate-800" id="refreshBtn"><span class="material-symbols-outlined">refresh</span></button></div>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-950 text-slate-400"><tr>
<th class="text-left p-4">Nominee ID</th><th class="text-left p-4 hidden" id="customerHeader">Customer</th><th class="text-left p-4">Name</th><th class="text-left p-4">Relation</th><th class="text-left p-4">Phone</th><th class="text-left p-4">Share %</th><th class="text-left p-4">Actions</th>
</tr></thead><tbody id="nomineeBody"></tbody></table></div>
<div class="hidden p-10 text-center text-slate-400" id="emptyState">No nominees found.</div>
</div>
</section></main>
<div class="hidden fixed inset-0 bg-black/70 z-[100] items-center justify-center p-4" id="nomineeModal">
<div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-6">
<div class="flex items-center justify-between mb-5"><h3 class="text-xl font-semibold" id="modalTitle">Add Nominee</h3><button class="text-slate-400 hover:text-white" id="closeModal"><span class="material-symbols-outlined">close</span></button></div>
<form class="space-y-4" id="nomineeForm">
<input id="nomineeId" type="hidden"/>
<div class="hidden" id="staffCustomerField"><label class="text-sm text-slate-400">Customer ID</label><input class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" id="formCustomerId" placeholder="e.g. 1001" type="number"/></div>
<div><label class="text-sm text-slate-400">Nominee Name</label><input class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" id="nomineeName" placeholder="e.g. Suresh Sharma" required=""/></div>
<div><label class="text-sm text-slate-400">Relation</label><input class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" id="relation" placeholder="e.g. Father" required=""/></div>
<div><label class="text-sm text-slate-400">Phone</label><input class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" id="phone" placeholder="e.g. 9000010001" required=""/></div>
<div><label class="text-sm text-slate-400">Share Percentage</label><input class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-lg p-3" id="sharePercent" max="100" min="0.01" placeholder="100" required="" step="0.01" type="number"/></div>
<div class="flex gap-3 justify-end pt-2"><button class="px-4 py-2 border border-slate-700 rounded-lg" id="cancelModal" type="button">Cancel</button><button class="px-4 py-2 bg-cyan-400 text-slate-950 rounded-lg font-semibold" type="submit">Save Nominee</button></div>
</form>
</div>
</div>
<script src="../shared/api.js"></script>
<script src="../shared/forms.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const session = getSession();
  if (!session) { window.location.href = "/login/code.html"; return; }

  const isCustomer = session.role === "Customer";
  const customerId = isCustomer ? Number(session.user.customerid) : null;
  const modal = document.getElementById("nomineeModal");
  const form = document.getElementById("nomineeForm");
  const body = document.getElementById("nomineeBody");
  const empty = document.getElementById("emptyState");
  const count = document.getElementById("nomineeCount");
  const total = document.getElementById("shareTotal");
  const staffField = document.getElementById("staffCustomerField");
  const customerHeader = document.getElementById("customerHeader");
  const formCustomerId = document.getElementById("formCustomerId");
  const accessType = document.getElementById("accessType");
  const pageTitle = document.getElementById("pageTitle");
  const tableTitle = document.getElementById("tableTitle");
  const newBtn = document.getElementById("newNomineeBtn");

  if (!isCustomer) {
    pageTitle.textContent = "Nominee Management";
    tableTitle.textContent = "All Nominees";
    accessType.textContent = "Staff";
    staffField.classList.remove("hidden");
    customerHeader.classList.remove("hidden");
  }
  document.getElementById("userBadge").textContent = `${session.user?.name || "User"} · ${session.role}`;

  function openModal(item=null) {
    document.getElementById("modalTitle").textContent = item ? "Edit Nominee" : "Add Nominee";
    document.getElementById("nomineeId").value = item?.nomineeid || "";
    formCustomerId.value = item?.customerid || "";
    document.getElementById("nomineeName").value = item?.name || "";
    document.getElementById("relation").value = item?.relation || "";
    document.getElementById("phone").value = item?.phone || "";
    document.getElementById("sharePercent").value = item?.sharepercent ?? "";
    if (isCustomer) formCustomerId.value = customerId;
    modal.classList.remove("hidden"); modal.classList.add("flex");
  }
  function closeModal() { modal.classList.add("hidden"); modal.classList.remove("flex"); form.reset(); document.getElementById("nomineeId").value=""; }

  async function loadList() {
    const endpoint = isCustomer ? `/nominees?customerId=${encodeURIComponent(customerId)}` : "/nominees";
    const result = await apiRequest(endpoint);
    const items = result.data || [];
    body.innerHTML = items.map(n => `
      <tr class="border-t border-slate-800">
        <td class="p-4">${escapeHtml(n.nomineeid)}</td>
        <td class="p-4 ${isCustomer ? "hidden" : ""}">${escapeHtml(n.customername || n.customerid)}</td>
        <td class="p-4 font-semibold">${escapeHtml(n.name)}</td>
        <td class="p-4">${escapeHtml(n.relation)}</td>
        <td class="p-4">${escapeHtml(n.phone)}</td>
        <td class="p-4">${Number(n.sharepercent).toFixed(2)}%</td>
        <td class="p-4"><div class="flex gap-2"><button data-action="edit" data-id="${escapeHtml(n.nomineeid)}" class="px-3 py-1.5 border border-slate-700 rounded">Edit</button><button data-action="delete" data-id="${escapeHtml(n.nomineeid)}" class="px-3 py-1.5 border border-red-900 text-red-300 rounded">Delete</button></div></td>
      </tr>`).join("");
    empty.classList.toggle("hidden", items.length !== 0);
    count.textContent = items.length;
    total.textContent = `${items.reduce((sum,n)=>sum+Number(n.sharepercent||0),0).toFixed(2)}%`;
    const staffCustomerCells = body.querySelectorAll("td:nth-child(2)");
    if (!isCustomer) staffCustomerCells.forEach(x=>x.classList.remove("hidden"));
    return items;
  }

  newBtn.addEventListener("click", () => openModal());
  document.getElementById("refreshBtn").addEventListener("click", () => loadList().catch(e=>showToast(e.message,"error")));
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const id = document.getElementById("nomineeId").value;
    const payload = {
      customerId: isCustomer ? customerId : Number(formCustomerId.value),
      role: session.role,
      name: document.getElementById("nomineeName").value.trim(),
      relation: document.getElementById("relation").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      sharePercent: Number(document.getElementById("sharePercent").value)
    };
    try {
      if (!payload.customerId) throw new Error("Customer ID is required");
      if (id) {
        await apiRequest(`/nominees/${encodeURIComponent(id)}`, {method:"PUT", body:JSON.stringify(payload)});
        showToast("Nominee updated");
      } else {
        await apiRequest("/nominees", {method:"POST", body:JSON.stringify(payload)});
        showToast("Nominee added");
      }
      closeModal(); await loadList();
    } catch (err) { showToast(err.message,"error"); }
  });

  body.addEventListener("click", async e => {
    const btn = e.target.closest("button[data-action]"); if (!btn) return;
    const items = await (isCustomer ? apiRequest(`/nominees?customerId=${encodeURIComponent(customerId)}`) : apiRequest("/nominees"));
    const item = (items.data || []).find(n => String(n.nomineeid) === String(btn.dataset.id));
    if (!item) return;
    try {
      if (btn.dataset.action === "edit") { openModal(item); return; }
      window.openNexusInfoModal({
        title: "Delete nominee?",
        description: "Remove this nominee from the customer record.",
        icon: "person_remove",
        content: `<p>Delete nominee <strong>${escapeHtml(item.name)}</strong> (${escapeHtml(item.relation)})? This action cannot be undone.</p>`,
        actions: [
          { label: "Cancel" },
          { label: "Delete Nominee", variant: "danger", icon: "delete", onClick: async () => {
            const query = new URLSearchParams();
            if (isCustomer) query.set("customerId", customerId);
            query.set("role", session.role);
            await apiRequest(`/nominees/${encodeURIComponent(item.nomineeid)}?${query.toString()}`, {method:"DELETE"});
            showToast("Nominee deleted");
            await loadList();
          }}
        ]
      });
    } catch (err) { showToast(err.message,"error"); }
  });

  await loadList().catch(e=>showToast(e.message,"error"));
});
</script>
<script src="../shared/app-shell.js"></script>
</body>
</html>
